[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent-sandbox"
dynamic = ["version"]
description = "Self-hostable disposable sandboxes for AI agents, with snapshot, rollback, and fork."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "superintelligenceco contributors" }]
keywords = ["sandbox", "ai-agents", "code-execution", "docker", "mcp", "snapshot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1,<1"]

[project.optional-dependencies]
server = [
  "docker>=7.2.0,<8",
  "fastapi>=0.141.1,<1",
  "pydantic>=2.13.5,<3",
  "uvicorn[standard]>=0.54.0,<1",
]
mcp = ["mcp>=2.2.0,<3"]
dev = [
  "agent-sandbox[server,mcp]",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
  "types-requests",
]

[project.scripts]
agent-sandbox = "agent_sandbox.cli:main"
agent-sandbox-mcp = "agent_sandbox.mcp_server:main"

[project.urls]
Homepage = "https://github.com/superintelligenceco/agent-sandbox"
Issues = "https://github.com/superintelligenceco/agent-sandbox/issues"
Changelog = "https://github.com/superintelligenceco/agent-sandbox/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/agent_sandbox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "N", "C4"]
ignore = ["S101", "S104", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"examples/**" = ["S105", "S106", "T201"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["docker: integration tests that need a working Docker daemon"]
