name: Mutation testing

# Weekly and on demand: mutmut mutates the core modules (the manager and the config
# parser) and reruns the unit tests against each mutant. Surviving mutants point
# at logic the tests don't pin down.

on:
  schedule:
    - cron: "13 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut on the core modules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" "mutmut==3.8.0"
      - name: Run mutmut
        run: mutmut run --max-children 4 || true
      - name: Summarize the results
        run: |
          mutmut results > results.txt || true
          {
            echo "## Mutation testing"
            echo
            echo '```text'
            grep -oE ': (killed|survived|no tests|timeout|suspicious|skipped|segfault)$' results.txt | sort | uniq -c || true
            echo
            grep -E ': survived$' results.txt | head -n 50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results
          path: results.txt
