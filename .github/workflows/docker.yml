name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  build:
    name: Build and scan the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload Trivy results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: agent-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image starts and reports its version
        run: docker run --rm agent-sandbox:ci --version
      - name: Scan the image with Trivy (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-sandbox:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
      - name: Upload the Trivy results to code scanning
        # Pull requests from forks and Dependabot get a read-only token.
        if: >-
          always() && github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-sandbox:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
