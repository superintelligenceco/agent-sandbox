name: Release

# A pushed `v*` tag builds everything, pushes the image with `vX.Y.Z` and
# `latest` tags, signs and attests it, builds standalone executables for Linux,
# macOS, and Windows, attaches them with the wheel, sdist, Compose file, install
# script, SBOMs, and checksums to the GitHub Release for that tag (creating the
# release from the CHANGELOG entry if it doesn't exist yet), and publishes the
# wheel and sdist to PyPI as `sic-agent-sandbox`.
# A manual run builds the same things, pushes the image as `edge`, and keeps the
# files as workflow run artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  dist:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1 twine==7.0.0 packaging==26.3
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/agent_sandbox/__init__.py").read())[1])')
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Install the wheel and start the MCP server
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[mcp]"
          /tmp/venv/bin/agent-sandbox --version
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 30 /tmp/venv/bin/agent-sandbox-mcp | tail -n 1 | jq -e '.result.tools | length == 10'
      - name: Generate the SBOM of the Python package
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: agent-sandbox-python.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: mv agent-sandbox-python.spdx.json dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  binaries:
    name: Standalone executable (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, asset: agent-sandbox-linux-x86_64 }
          - { os: ubuntu-24.04-arm, asset: agent-sandbox-linux-aarch64 }
          - { os: macos-latest, asset: agent-sandbox-macos-arm64 }
          - { os: windows-latest, asset: agent-sandbox-windows-x86_64.exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[server]" pyinstaller==6.22.3
      - run: sh scripts/build_executable.sh
      - name: Rename the executable
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p out
          if [ -f dist-exe/agent-sandbox.exe ]; then src=dist-exe/agent-sandbox.exe; else src=dist-exe/agent-sandbox; fi
          mv "$src" "out/$ASSET"
      - name: Check the version and render the OpenAPI document
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          "out/$ASSET" --version
          "out/$ASSET" openapi -o openapi.json
          python -c 'import json; d = json.load(open("openapi.json")); assert d["openapi"].startswith("3.1"), d["openapi"]; print(len(d["paths"]), "paths")'
      - name: Serve and run a command in a real sandbox
        if: runner.os == 'Linux'
        env:
          ASSET: ${{ matrix.asset }}
          AGENT_SANDBOX_API_KEYS: ci-only-key-0123456789abcdef
          AGENT_SANDBOX_DATA_DIR: ${{ runner.temp }}/data
          KEY: ci-only-key-0123456789abcdef
        run: |
          set -euo pipefail
          docker pull alpine:3.20
          "out/$ASSET" serve --port 8080 > serve.log 2>&1 &
          for _ in $(seq 30); do curl -sf localhost:8080/healthz > /dev/null && break; sleep 1; done
          api() { curl -sf -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" "$@"; }
          SB=$(api -X POST localhost:8080/v1/sandboxes -d '{"image": "alpine:3.20"}' | jq -r .id)
          api -X POST "localhost:8080/v1/sandboxes/$SB/exec" -d '{"command": "echo ok"}' | jq -e '.stdout == "ok\n"'
          api -X DELETE "localhost:8080/v1/sandboxes/$SB"
          kill %1
          cat serve.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exe-${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  image:
    name: Build, push, sign, and attest the multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing and build provenance
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the pushed image starts and reports its version
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          # Remove the image between runs: Docker can't hold two platforms of
          # one manifest-list digest at the same time.
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$REF" --version
            docker image rm "$REF"
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image with cosign (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: mkdir -p sbom
      - name: Generate the SBOM of the image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom/agent-sandbox-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image
          path: sbom/
          if-no-files-found: error

  compose:
    name: Smoke-test the pushed image with Docker Compose
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the Compose file to this image
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'edge' }}
        run: |
          mkdir -p out
          sed "s|:\${AGENT_SANDBOX_VERSION:-latest}|:\${AGENT_SANDBOX_VERSION:-$VERSION}|" docker-compose.yml > out/docker-compose.yml
          grep -F ":-$VERSION}" out/docker-compose.yml
          cp install.sh out/install.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the stack
        working-directory: out
        run: docker compose up -d --wait
        env:
          AGENT_SANDBOX_API_KEY: ci-only-key-0123456789abcdef
          AGENT_SANDBOX_DEFAULT_IMAGE: alpine:3.20
      - name: Create, exec, snapshot, roll back, destroy
        env:
          KEY: ci-only-key-0123456789abcdef
        run: |
          set -euo pipefail
          api() { curl -sf -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" "$@"; }
          SB=$(api -X POST localhost:8080/v1/sandboxes -d '{}' | jq -r .id)
          api -X POST "localhost:8080/v1/sandboxes/$SB/exec" -d '{"command": "echo ok > f"}' | jq -e '.exit_code == 0'
          SNAP=$(api -X POST "localhost:8080/v1/sandboxes/$SB/snapshots" -d '{}' | jq -r .id)
          api -X POST "localhost:8080/v1/sandboxes/$SB/exec" -d '{"command": "rm f"}' | jq -e '.exit_code == 0'
          api -X POST "localhost:8080/v1/sandboxes/$SB/rollback" -d "{\"snapshot_id\": \"$SNAP\"}" > /dev/null
          api -X POST "localhost:8080/v1/sandboxes/$SB/exec" -d '{"command": "cat f"}' | jq -e '.stdout == "ok\n"'
          api -X DELETE "localhost:8080/v1/sandboxes/$SB"
      - name: Show logs
        if: failure()
        working-directory: out
        run: docker compose logs
        env:
          AGENT_SANDBOX_API_KEY: unused-0123456789abcdef
      - name: Tear down
        if: always()
        working-directory: out
        run: docker compose down -v
        env:
          AGENT_SANDBOX_API_KEY: unused-0123456789abcdef
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose
          path: |
            out/docker-compose.yml
            out/install.sh
          if-no-files-found: error

  publish:
    name: Attach files to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, binaries, image, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance for the release files
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Write checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Attest the release files' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Write the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | AGENT_SANDBOX_VERSION=${TAG} sh
          \`\`\`

          Or download \`docker-compose.yml\` from this release and run \`docker compose up -d\`.

          Image: \`${IMAGE}:${TAG}\` (\`${IMAGE_DIGEST}\`), signed with cosign keyless signing.
          Verify the build provenance of any file on this release with
          \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`, and the image with
          \`gh attestation verify oci://${IMAGE}:${TAG} -R ${GITHUB_REPOSITORY}\`.
          NOTES
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
          fi
          gh release upload "$TAG" assets/* --clobber

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, binaries, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: artifact
      - name: Keep only the wheel and the sdist
        run: |
          mkdir -p dist
          mv artifact/*.whl artifact/*.tar.gz dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
