name: Release

# A pushed `v*` tag builds everything, pushes the image with `vX.Y.Z` and
# `latest` tags, and attaches the wheel, sdist, and Compose file to the GitHub
# Release for that tag, creating the release if it doesn't exist yet.
# A manual run builds the same things, pushes the image as `edge`, and keeps the
# files as workflow run artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  dist:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2 twine==6.1.0
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/agent_sandbox/__init__.py").read())[1])')
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Install the wheel and start the MCP server
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[mcp]"
          /tmp/venv/bin/agent-sandbox --version
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 30 /tmp/venv/bin/agent-sandbox-mcp | tail -n 1 | jq -e '.result.tools | length == 10'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the pushed image starts and reports its version
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          # Remove the image between runs: Docker can't hold two platforms of
          # one manifest-list digest at the same time.
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$REF" --version
            docker image rm "$REF"
          done

  compose:
    name: Smoke-test the pushed image with Docker Compose
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the Compose file to this image
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'edge' }}
        run: |
          mkdir -p out
          sed "s|:\${AGENT_SANDBOX_VERSION:-latest}|:\${AGENT_SANDBOX_VERSION:-$VERSION}|" docker-compose.yml > out/docker-compose.yml
          grep -F ":-$VERSION}" out/docker-compose.yml
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the stack
        working-directory: out
        run: docker compose up -d --wait
        env:
          AGENT_SANDBOX_API_KEY: ci-only-key-0123456789abcdef
          AGENT_SANDBOX_DEFAULT_IMAGE: alpine:3.20
      - name: Create, exec, snapshot, roll back, destroy
        env:
          KEY: ci-only-key-0123456789abcdef
        run: |
          set -euo pipefail
          api() { curl -sf -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" "$@"; }
          SB=$(api -X POST localhost:8080/v1/sandboxes -d '{}' | jq -r .id)
          api -X POST "localhost:8080/v1/sandboxes/$SB/exec" -d '{"command": "echo ok > f"}' | jq -e '.exit_code == 0'
          SNAP=$(api -X POST "localhost:8080/v1/sandboxes/$SB/snapshots" -d '{}' | jq -r .id)
          api -X POST "localhost:8080/v1/sandboxes/$SB/exec" -d '{"command": "rm f"}' | jq -e '.exit_code == 0'
          api -X POST "localhost:8080/v1/sandboxes/$SB/rollback" -d "{\"snapshot_id\": \"$SNAP\"}" > /dev/null
          api -X POST "localhost:8080/v1/sandboxes/$SB/exec" -d '{"command": "cat f"}' | jq -e '.stdout == "ok\n"'
          api -X DELETE "localhost:8080/v1/sandboxes/$SB"
      - name: Show logs
        if: failure()
        working-directory: out
        run: docker compose logs
        env:
          AGENT_SANDBOX_API_KEY: unused-0123456789abcdef
      - name: Tear down
        if: always()
        working-directory: out
        run: docker compose down -v
        env:
          AGENT_SANDBOX_API_KEY: unused-0123456789abcdef
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose
          path: out/docker-compose.yml
          if-no-files-found: error

  publish:
    name: Attach files to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Write checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" assets/* --clobber
